trigger:
- main


resources:
  repositories:
    - repository: terraformrepo
      type: github
      name: shamimgit2021/azure_terraform_modules
      ref: refs/heads/main
      endpoint: "github_devops"

variables:
  azureServiceConnection: 'Azure_Azuredevops_serviceconnection'

steps:

- checkout: self
# 1️⃣ Checkout Terraform GitHub repository
- checkout: terraformrepo

# Install Terraform (VERY IMPORTANT)
- task: TerraformInstaller@1
  displayName: Install Terraform
  inputs:
    terraformVersion: 'latest'

- script: terraform init
  workingDirectory: '$(Build.SourcesDirectory)/azure_terraform_modules'
  displayName: Terraform Init

- script: terraform plan
  workingDirectory: '$(Build.SourcesDirectory)/azure_terraform_modules'
  displayName: Terraform Plan

- script: terraform apply -auto-approve
  workingDirectory: '$(Build.SourcesDirectory)/azure_terraform_modules'
  displayName: Terraform Apply
