trigger:
- main


resources:
  repositories:
    - repository: newtemplates
      type: github
      name: shamimgit2021/azure_terraform_modules
      endpoint: "github_devops"

variables:
  azureServiceConnection: 'Azure_Azuredevops_serviceconnection'

steps:

# 1️⃣ Checkout Terraform GitHub repository
- checkout: newtemplates

# 2️⃣ Install Terraform
- task: TerraformInstaller@1
  displayName: Install Terraform
  inputs:
    terraformVersion: 'latest'

# 3️⃣ Terraform Init (NO backend)
- task: TerraformTaskV4@4
  displayName: Terraform Init
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(Build.SourcesDirectory)/newtemplates/azure_terraform_modules'
    environmentServiceNameAzureRM: $(azureServiceConnection)

# 4️⃣ Terraform Plan
- task: TerraformTaskV4@4
  displayName: Terraform Plan
  inputs:
    provider: 'azurerm'
    command: 'plan'
    workingDirectory: '$(Build.SourcesDirectory)/newtemplates/azure_terraform_modules'  # ✅ Fixed: Changed from "module" to "modules"
    environmentServiceNameAzureRM: $(azureServiceConnection)

# 5️⃣ Terraform Apply
- task: TerraformTaskV4@4
  displayName: Terraform Apply
  inputs:
    provider: 'azurerm'
    command: 'apply'
    workingDirectory: '$(Build.SourcesDirectory)/newtemplates/azure_terraform_modules'  # ✅ Fixed: Changed from just "newtemplates" to include the full path
    environmentServiceNameAzureRM: $(azureServiceConnection)
