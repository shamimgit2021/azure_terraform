trigger:
- main


resources:
  repositories:
    - repository: terraformrepo
      type: github
      name: shamimgit2021/azure_terraform_modules
      ref: refs/heads/main
      endpoint: "github_devops"

variables:
  azureServiceConnection: 'Azure_Azuredevops_serviceconnection'

steps:

- checkout: self
# 1️⃣ Checkout Terraform GitHub repository
- checkout: terraformrepo

- script: |
    echo "Current Sources Directory:"
    ls -R $(Build.SourcesDirectory)
  displayName: Debug Folder Structure

- script: terraform init
  workingDirectory: '$(Build.SourcesDirectory)/terraformrepo'
  displayName: Terraform Init

- script: terraform plan
  workingDirectory: '$(Build.SourcesDirectory)/terraformrepo'
  displayName: Terraform Plan

- script: terraform apply -auto-approve
  workingDirectory: '$(Build.SourcesDirectory)/terraformrepo'
  displayName: Terraform Apply
